<div>
<form [formGroup]="profileform"  (ngSubmit)="submit()">
    <div>
        <label for="name">Name: </label>
        <input type="text" id="name" placeholder="enter the name" formControlName="name" required />
    </div>
    <div>
        <label for="address">Address: </label>
        <input type="text" id="address" placeholder="enter the address" formControlName="address" required />

        <label for="pincode">Pincode: </label>
        <input type="number" id="pincode" formControlName="pincode" required />
    </div>

    <div>

        <label for="email">Email: </label>
        <input type="email" id="email" placeholder="enter your email" formControlName="email" required />
    </div>

    <div>

        <label for="phone">Phone: </label>
        <input type="number" id="phone" placeholder="enter your number" formControlName="phone" required />
    </div>

    <div>

        <label>Gender: </label>

        <select name="gender" formControlName="gender">
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>

        </select>

    </div>

    <label for="dob">DOB:</label>
    <input type="date" id="dob" formControlName="DOB" />
    <br><br>

    <button type="submit" onclick="submit()">Submit</button>
</form>
</div>


<button type = "button" (click)="preview()">Preview</button>

<div *ngIf="userdatalist.length > 0;">
    <p>Showing results for: {{searchText}}</p>
    
<table  border="1" >
    <tr>
    <th>Name</th>
    <th>Address</th>
    <th>Pincode</th>
    <th>Email</th>
    <th>Phone</th>
    <th>Gender</th>
    <th>DOB</th>
    </tr>
    <tbody>
        <tr *ngFor="let user of filteredData | paginate: { itemsPerPage: 5, currentPage: page }">


            <td>{{user.name}}</td>
            <td>{{user.address}}</td>
            <td>{{user.pincode}}</td>
            <td>{{user.email}}</td>
            <td>{{user.phone}}</td>
            <td>{{user.gender}}</td>
            <td>{{user.DOB}}</td>

        </tr>

    </tbody>
        
</table> 
<pagination-controls
  (pageChange)="page = $event">
</pagination-controls>

<input
  type="text"
  placeholder="Filter by name"
  [(ngModel)]="searchText"
/>

<button type="button" (click)="filteredData">Search</button>
</div>
