<form #userform="ngForm"  (ngSubmit)="submit()">

    <div>
    <label for="name">First Name:</label>
    
    <input type="text" id="name" name="First_Name" [(ngModel)]="user.First_Name" required>

    <label for="name">Last Name:</label>
    
    <input type="text" id="name" name="Last_Name" [(ngModel)]="user.Last_Name" required>

  </div>
  <div>
    <label for="email">Email</label>
    <input type="email" id="email" name="Email" [(ngModel)]="user.Email" placeholder="Email" required>
  </div>

   <div> 
    <label for="address">Address:</label>
    
    <input type="text" id="address" name="Address" [(ngModel)]="user.Address" placeholder="Address" required>

  
     <label for="pincode">Pincode:</label>
    
    <input type="number" id="pincode" name="Pincode" [(ngModel)]="user.Pincode"  placeholder="Pincode" required> 
    </div>
    <div>
    <label for = "tel">Phone</label>
    <input type="tel" id="tel" name="Phone" [(ngModel)]="user.Phone" placeholder="Phone" required>
    </div>
    <div>
        <label>     Gender</label>
        <select name="Gender" [(ngModel)]="user.Gender"  required>
            <option value="">select</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            
        </select>
    </div>
    <label for="dob">Dob</label>
    <input type="date" id="dob" name="Dob" [(ngModel)]="user.Dob">
    <br><br>


    <button type="submit" onclick="submit()">Submit</button>



</form>
