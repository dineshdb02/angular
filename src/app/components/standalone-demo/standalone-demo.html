<form [formGroup]="profileform">
    <div>
        <label for="name">Name: </label>
        <input type="text" id="name" placeholder="enter the name" formControlName="name" required />
    </div>

    <div>

        <label for="email">Email: </label>
        <input type="email" id="email" placeholder="enter your email" formControlName="email" required />
    </div>


    <div>

        <label for="phone">Phone: </label>
        <input type="number" id="phone" placeholder="enter your number" formControlName="phone" required />
    </div>

    <button type="submit">confirm</button>


    <h1>hello to features</h1>
